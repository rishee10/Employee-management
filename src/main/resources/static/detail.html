<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employee Details</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="/">Employee Management</a>
    </div>
  </nav>

  <main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center page-header">
      <div>
        <h1 class="h3 mb-0">Employee Details</h1>
        <p class="text-muted mb-0">View full employee profile</p>
      </div>
      <div class="mt-2 mt-md-0">

        <a class="btn btn-outline-secondary" href="/">Back to list</a>
      </div>
    </div>

    <div id="alertBox" class="alert d-none" role="alert"></div>

    <div class="card shadow-sm">
      <div class="card-body">
        <dl class="row mb-0" id="detailList"></dl>
      </div>
    </div>

  <script type="module" src="/js/detail-page.js"></script>
