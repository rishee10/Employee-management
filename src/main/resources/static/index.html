<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employees</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="/">Employee Management</a>
    </div>
  </nav>

  <main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center page-header">
      <div>
        <h1 class="h3 mb-0">Employee List</h1>
        <p class="text-muted mb-0">Search, filter, and manage employee records</p>
      </div>
      <div class="mt-2 mt-md-0">
        <a href="/add.html" class="btn btn-primary me-2">Add Employee</a>
        <button id="exportBtn" class="btn btn-outline-secondary">Export CSV</button>
      </div>
    </div>

    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <form id="filterForm" class="row g-3">
          <div class="col-md-4">
            <label class="form-label" for="search">Search (name or email)</label>
            <input type="search" class="form-control" id="search" placeholder="e.g. Priya or @kloudspot.com">
          </div>
          <div class="col-md-3">
            <label class="form-label" for="department">Department</label>
            <select class="form-select" id="department">
              <option value="">All departments</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label" for="status">Employment status</label>
            <select class="form-select" id="status">
              <option value="">All</option>
              <option value="ACTIVE">Active</option>
              <option value="INACTIVE">Inactive</option>
            </select>
          </div>
          <div class="col-md-2 d-flex align-items-end">
            <button type="submit" class="btn btn-outline-primary w-100">Apply</button>
          </div>
        </form>
      </div>
    </div>

    <div id="alertBox" class="alert d-none" role="alert"></div>

    <div class="card shadow-sm">
      <div class="table-responsive">
        <table class="table table-hover mb-0 align-middle">
          <thead class="table-light">
            <tr>
              <th>Employee ID</th>
              <th>Name</th>
              <th>Email</th>
              <th>Department</th>
              <th>Status</th>
              <th class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody id="employeeTableBody"></tbody>
        </table>
      </div>
      <div id="emptyState" class="empty-state d-none">No employees match your filters.</div>
      <div class="card-footer d-flex flex-wrap justify-content-between align-items-center gap-2">
        <span id="pageInfo" class="text-muted small"></span>
        <nav>
          <ul class="pagination mb-0" id="pagination"></ul>
        </nav>
      </div>
    </div>
  </main>

  <div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Confirm delete</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          Are you sure you want to delete <strong id="deleteEmployeeName"></strong>? This action cannot be undone.
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/js/list.js"></script>
</body>
</html>
